# Version-controlled, code-reviewed vetted slice loaded idempotently at startup
# into the `atlastechnique` table. NOT a network autoload of the full MITRE
# ATLAS corpus — that is Path-2 (future ТЗ). One table, `framework` field:
#   - attack : classic MITRE ATT&CK techniques our ThreatIndicator seed (ТЗ-05)
#              already references — so indicator→technique migration resolves.
#   - atlas  : AI-specific AML.* techniques (MITRE ATLAS) for the coverage map's
#              breadth (and to surface honest gaps where we have no indicator).
#
# Fields: technique_id, framework, name, tactic, description, parent_technique, url.

