# Detector registry + detector↔technique bindings (ТЗ-08).
#
# These detectors ALREADY EXIST in code — this seed does NOT implement detection,
# it only REGISTERS each existing correlation detector with a stable
# `detector_key` and binds it to techniques so the coverage map can SEE
# correlations (not just indicators). This is the fix for the "zero AML coverage"
# paradox: AML.T0051 (IPI) is detected behaviorally by staging_chain /
# external_trigger, so it is covered via a DETECT control even though no
# indicator points at it.
#
# `rule_ids` are the literal finding rule_id strings the detector emits, recorded
# for traceability only (the detector code is NOT touched).
#
# control_type uses the OWASP rationale taxonomy. Correlations are DETECT (they
# observe behavior) vs indicators which SCOPE/PREV (they limit access to an
# artefact).

detectors:
  - detector_key: staging_chain
    name: Staging chain (IOA)
    kind: correlation
    rule_ids: ioa.staging_chain
    description: "sequence_service.detect_staging_chain — trigger→write staging behavior."
  - detector_key: exfil_sequence
    name: Exfiltration sequence (IOA)
    kind: correlation
    rule_ids: ioa.exfil_sequence
    description: "sequence_service.detect_exfil_sequence — credential read → egress within window."
  - detector_key: external_trigger
    name: External-content trigger
    kind: correlation
    rule_ids: ioa.staging_chain
    description: "sequence_service content.read.external flag — untrusted content drives the staging chain (IPI)."
  - detector_key: rug_pull_tofu
    name: Rug-pull / TOFU (MCP · hook · skill · agent)
    kind: correlation
    rule_ids: mcp.rug_pull.description_changed,mcp.rug_pull.tools_changed,mcp.rug_pull.definition_changed,hook.rug_pull.content,hook.rug_pull.command,skill.rug_pull.content,agent.rug_pull.dangerous
    description: "{mcp,hook,skill,agent}_baseline_service.update_and_detect — trust-on-first-use: тихий дрейф отпечатка описания/инструментов/скрипта доверенного компонента (rug-pull цепочки поставок)."
  - detector_key: heartbeat_silent
    name: Sensor silence / hooks removed
    kind: correlation
    rule_ids: sensor.silent,sensor.hooks_removed
    description: "sensor_health_service.tick + heartbeat endpoint — silenced or self-disabled sensor."
  - detector_key: slow_chain
    name: Low-and-slow kill chain (IOA)
    kind: correlation
    rule_ids: ioa.slow_chain
    description: "slow_chain_service.tick — >=3 distinct advanced kill-chain stages over a 14-day horizon; catches chains deliberately spread across days to slip past the window-bounded sequence/chain matchers."
  - detector_key: ai_trigger_escalation
    name: AI-trigger → escalation (IOA)
    kind: correlation
    rule_ids: ioa.ai_trigger_escalation
    description: "supply_chain_escalation_service.tick — links an AI-origin trigger (MCP rug-pull / skill-hook-agent drift / prompt injection) to a subsequent endpoint escalation (exfil/C2/impact, or an ioa.* chain) on the same machine within a window. The connected attack a classic EDR cannot see — ccguard's differentiating moat."
  - detector_key: fleet_campaign
    name: Fleet supply-chain campaign (IOA)
    kind: correlation
    rule_ids: ioa.fleet_campaign
    description: "fleet_campaign_service.tick — groups AI-origin trigger findings (MCP rug-pull / skill-hook-agent drift) by the COMPROMISED COMPONENT's identity across the whole fleet; fires when one component lands on >= min_machines distinct machines in a window. The org-wide supply-chain campaign a per-endpoint EDR structurally cannot aggregate (robust to the identical-poison is_divergent blind spot)."
  - detector_key: toxic_flow
    name: Toxic flow / confused deputy (IOA)
    kind: correlation
    rule_ids: ioa.toxic_flow
    description: "sequence_service.detect_toxic_flow — untrusted/external content (content.read.external) directly followed by a WEAPONIZED sink (agent-config self-tamper / persistence / destruction / suspicious-host exfil) carried out with the agent's own authority. The confused-deputy flow that needs no malware; catches the external→sink-direct case that exfil_sequence (needs a credential read) and staging_chain (needs a staging write) miss."
  - detector_key: memory_baseline
    name: Memory / instruction drift (TOFU)
    kind: correlation
    rule_ids: memory.new,memory.external,memory.drift,memory.removed
    description: "memory_baseline_service.update_and_detect — trust-on-first-use over CLAUDE.md at every level and its @import chain. Injected standing instructions ('before any command, first …') execute with the agent's own authority because to the agent they ARE its memory, not input to re-check. Catches a new/changed instruction file, and separately an instruction pulled from OUTSIDE the repo (external @import / ancestor CLAUDE.md) that no code review would see."
  - detector_key: sandbox_baseline
    name: Sandbox perimeter weakening (posture drift)
    kind: correlation
    rule_ids: sandbox.weakened
    description: "sandbox_baseline_service.update_and_detect — эффективное состояние песочницы Claude Code (включена ли, egress-allowlist, ослабляющие флаги) сводится с эталоном; асимметрично реагирует только на ОСЛАБЛЕНИЕ периметра (выключили песочницу, расширили egress-allowlist, разрешили команды в обход изоляции, сняли fail-closed). Impair Defenses над самим механизмом изоляции агента — ослабление, которое открывает дорогу exec/egress, наблюдаемое до, а не после инцидента."
  - detector_key: automemory_baseline
    name: Auto-memory poisoning (feature-delta)
    kind: correlation
    rule_ids: automemory.anomaly
    description: "auto_memory_baseline_service.update_and_detect — АВТО-память Claude Code (MEMORY.md, которую агент переписывает сам) сводится по числовым признакам с предыдущим снимком, потому что hash-дрейф тут бесполезен (меняется каждую сессию). Ловит аномальную дельту: внезапный вброс объёма, новый внешний @import, всплеск атака-маркеров/URL. Отравление собственной памяти агента персистит между сессиями и исполняется с его полномочиями — это Memory & Context Poisoning (ASI06), которое обычный EDR не видит."
  - detector_key: intercomm_channel
    name: Inter-agent channel (remote MCP + agent-to-model egress)
    kind: correlation
    rule_ids: intercomm.remote_channel
    description: "mcp_baseline_service — появление НОВОГО удалённого MCP-канала (transport http/sse) после bootstrap машины: канал доверия агент→сервер поверх сети, где удалённая сторона доставляет агенту инструменты и их описания (уходят в LLM как авторитетные). Дополняется поведенческим сигналом intercomm.remote_agent (агент регистрирует remote-MCP или зовёт чужой LLM-API из shell — межагентный egress). Небезопасная межагентная коммуникация (ASI07): канал вне наблюдения хука, отдельный от подмены компонента (rug-pull=ASI04)."

# detector_key → technique bindings. framework duplicated for query convenience.
