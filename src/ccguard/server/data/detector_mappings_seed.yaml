  - detector_key: staging_chain
    technique_id: ASI01
    framework: owasp
    control_type: DETECT
    relevance: primary
  - detector_key: staging_chain
    technique_id: AML.T0051
    framework: atlas
    control_type: DETECT
    relevance: primary
  - detector_key: staging_chain
    technique_id: T1074
    framework: attack
    control_type: DETECT
    relevance: secondary
  # external_trigger: IPI — untrusted content drives the agent.
  - detector_key: external_trigger
