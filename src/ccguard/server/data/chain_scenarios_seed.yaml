# Kill-chain SCENARIOS as data (ТЗ-09).
#
# A scenario is a sequence of STAGES (tactic), NOT channels/techniques. The
# universal chain_engine executes any scenario here; adding one is rows in this
# file, not code. A step fires on ANY event whose derived stage matches —
# so a new exfil channel (new indicator/signal under `exfiltration`) is caught
# with NO change to the scenario.
#
# Stages must be backed by a signal the agent emits (see chain_constants
# _SIGNAL_STAGE_RULES). As of P2/P4 every endpoint kill-chain stage is now
# mapped (impact, defense-evasion, command-and-control, lateral-movement all
# have signals), so the scenarios below fire end-to-end — the data-driven
# promise made concrete: new chains are rows here, not engine code.
#
# Loaded idempotently at startup (insert-or-skip on scenario_key). Severity uses
# the FindingRecord vocabulary (info|warn|block|critical).

scenarios:
  - scenario_key: recon_to_exfil
    name: "Внешний триггер → доступ к секретам → вынос"
    description: >-
      IPI / external-content trigger leads to credential access and then
      exfiltration over ANY channel. The exfiltration step is stage-level, so it
      catches a never-before-seen channel (e.g. a new paste/bot host) the moment
      an indicator for it exists — the scenario is untouched.
    window_seconds: 300
    severity: critical
    require_order: true
    steps:
      - {step_index: 0, tactic: initial-access, description: "external content / injection trigger"}
      - {step_index: 1, tactic: credential-access, description: "read any secret"}
      - {step_index: 2, tactic: collection, optional: true, description: "stage data (optional)"}
      - {step_index: 3, tactic: exfiltration, description: "ANY egress channel"}

  - scenario_key: recon_stage_persist
    name: "Внешний триггер → доступ → закрепление"
    description: >-
      External trigger leads (optionally via credential access) to persistence —
      a malicious hook/skill/cron that survives the session.
    window_seconds: 600
    severity: block
    require_order: true
    steps:
      - {step_index: 0, tactic: initial-access}
      - {step_index: 1, tactic: credential-access, optional: true}
      - {step_index: 2, tactic: persistence, description: "rc/cron/agent-settings edit"}

  - scenario_key: poison_to_destructive
    name: "Компрометация цепочки → выполнение → деструктив"
    description: >-
      Supply-chain / rug-pull entry leads to code execution and then a
      destructive action (impact.* signals now live — fires end-to-end).
    window_seconds: 300
    severity: block
    require_order: true
    steps:
      - {step_index: 0, tactic: initial-access, description: "supply-chain / pkg.publish entry"}
      - {step_index: 1, tactic: execution, description: "pipe-to-shell / eval"}
      - {step_index: 2, tactic: impact, description: "destructive (rm -rf / DROP / dd)"}

  # --- P2/P4 flagship chains: now fireable thanks to the revived stages -----
  - scenario_key: injection_to_c2
    name: "Инъекция → выполнение → C2 (reverse shell)"
    description: >-
      External/MCP-delivered injection leads to code execution and then an
      interactive command-and-control channel (reverse shell / tunnel). The
      initial-access step also fires on MCP tool-results (content.read.external).
    window_seconds: 600
    severity: critical
    require_order: true
    steps:
      - {step_index: 0, tactic: initial-access, description: "external content / MCP tool-result injection"}
      - {step_index: 1, tactic: execution, description: "pipe-to-shell / eval / inline code"}
      - {step_index: 2, tactic: command-and-control, description: "reverse shell / outbound tunnel"}

  - scenario_key: exfil_then_coverup
    name: "Доступ → вынос → заметание следов"
    description: >-
      Credential access followed by exfiltration over ANY channel, then a
      defense-evasion action (clearing shell history / system logs / disabling
      security tooling). The cover-up step strongly confirms malicious intent.
      Severity is `block` (not critical): the cover-up leg can be `history -c`,
      which has a non-trivial benign base rate, so we surface but don't scream.
    window_seconds: 600
    severity: block
    require_order: true
    steps:
      - {step_index: 0, tactic: credential-access, description: "read any secret"}
      - {step_index: 1, tactic: exfiltration, description: "ANY egress channel"}
      - {step_index: 2, tactic: defense-evasion, description: "clear history/logs / disable tooling"}

  - scenario_key: evade_then_steal
    name: "Ослепление защиты → доступ → вынос"
    description: >-
      The attacker first disables the security tooling / EDR hook or clears
      logs (defense-evasion), then reads secrets and exfiltrates — the classic
      "go dark, then steal" sequence. Pairs with the hook.removed tamper finding.
    window_seconds: 900
    severity: critical
    require_order: true
    steps:
      - {step_index: 0, tactic: defense-evasion, description: "disable security tooling / clear logs"}
      - {step_index: 1, tactic: credential-access, description: "read any secret"}
      - {step_index: 2, tactic: exfiltration, description: "ANY egress channel"}

  # === P8 expansion: more AI-agent kill-chains (data, not code) ===========
  # Each pairs clearly-suspicious stages, require_order=true to limit FP. Every
  # stage is backed by an agent signal (chain_constants._SIGNAL_STAGE_RULES).

  - scenario_key: recon_to_theft
    name: "Разведка → доступ к секретам → вынос"
    description: >-
      Host/cloud/account discovery, then a secret read, then exfiltration. The
      recon leg distinguishes a targeted sweep from an incidental secret read.
    window_seconds: 600
    severity: critical
    require_order: true
    steps:
      - {step_index: 0, tactic: discovery, description: "host/cloud/account enum"}
      - {step_index: 1, tactic: credential-access, description: "read any secret"}
      - {step_index: 2, tactic: exfiltration, description: "ANY egress channel"}

  - scenario_key: collect_then_exfil
    name: "Сбор/стейджинг → вынос"
    description: >-
      Dedicated collection (archive/clipboard/screen/db-dump) followed by
      exfiltration — the deferred "stage now, leak later" pattern that the
      minute-window exfil detector misses.
    window_seconds: 900
    severity: block
    require_order: true
    steps:
      - {step_index: 0, tactic: collection, description: "archive/clipboard/db-dump staging"}
      - {step_index: 1, tactic: exfiltration, description: "ANY egress channel"}

  - scenario_key: privesc_to_destructive
    name: "Повышение привилегий → деструктив"
    description: >-
      A privilege-escalation primitive (sudo/chmod/hosts/container-escape) then a
      destructive impact — escalate first, then wipe/encrypt.
    window_seconds: 600
    severity: block
    require_order: true
    steps:
      - {step_index: 0, tactic: privilege-escalation, description: "sudo/chmod/hosts/container escape"}
      - {step_index: 1, tactic: impact, description: "destructive (rm -rf / DROP / dd / mkfs)"}

  - scenario_key: c2_then_exfil
    name: "C2 → вынос"
    description: >-
      An interactive command-and-control channel (reverse shell / tunnel) then
      exfiltration over any channel — hands-on-keyboard data theft.
    window_seconds: 900
    severity: critical
    require_order: true
    steps:
      - {step_index: 0, tactic: command-and-control, description: "reverse shell / outbound tunnel"}
      - {step_index: 1, tactic: exfiltration, description: "ANY egress channel"}

  - scenario_key: evade_to_persist
    name: "Ослепление защиты → закрепление"
    description: >-
      Disable the security tooling / clear logs (defense-evasion) then install
      persistence — go dark, then entrench so the foothold survives the session.
    window_seconds: 900
    severity: block
    require_order: true
    steps:
      - {step_index: 0, tactic: defense-evasion, description: "disable tooling / clear logs"}
      - {step_index: 1, tactic: persistence, description: "rc/cron/systemd/authorized_keys"}

  - scenario_key: injection_to_persist
    name: "Внешний триггер → закрепление"
    description: >-
      External-content / MCP-delivered injection leads straight to persistence
      (a hook/cron/agent-settings drop) with no secret step — the attacker
      entrenches before doing anything noisy.
    window_seconds: 600
    severity: block
    require_order: true
    steps:
      - {step_index: 0, tactic: initial-access, description: "external content / MCP injection"}
      - {step_index: 1, tactic: persistence, description: "hook/cron/agent-settings drop"}

  - scenario_key: full_intrusion
    name: "Вторжение целиком: триггер → выполнение → доступ → вынос"
    description: >-
      The full four-stage story — an AI-origin trigger, code execution, a secret
      read, then exfiltration. The strongest single-session signal of a real
      compromise driven through the agent.
    window_seconds: 900
    severity: critical
    require_order: true
    steps:
      - {step_index: 0, tactic: initial-access, description: "external content / MCP / supply-chain entry"}
      - {step_index: 1, tactic: execution, description: "pipe-to-shell / eval / inline code"}
      - {step_index: 2, tactic: credential-access, description: "read any secret"}
      - {step_index: 3, tactic: exfiltration, description: "ANY egress channel"}

  - scenario_key: exec_evade_exfil
    name: "Выполнение → ослепление → вынос"
    description: >-
      Code execution, then clearing history/logs or disabling tooling, then
      exfiltration — run the payload, cover the tracks, leak the data.
    window_seconds: 900
    severity: block
    require_order: true
    steps:
      - {step_index: 0, tactic: execution, description: "pipe-to-shell / eval"}
      - {step_index: 1, tactic: defense-evasion, description: "clear history/logs / disable tooling"}
      - {step_index: 2, tactic: exfiltration, description: "ANY egress channel"}

  # NOTE: a cred→lateral chain was intentionally NOT added — `ssh host <cmd>`
  # is the universal deploy/CI idiom, so `read .env` + `ssh deploy@prod restart`
  # would manufacture a finding on every deploy. lateral.remote_exec stays a
  # low-weight informational tag; lateral-pivot detection needs host-allowlist
  # context (a future refinement), not a bare ssh-command stage match.
