  # ===== OWASP Top 10 for Agentic Applications (framework=owasp) =============
  # ASI01..ASI10 — the agentic layer. All in scope; ASI06/07/08/09 are HONEST
  # gaps today (no detector/indicator yet) and should show as such on the map.
  #
  # IMPORTANT — `tactic` for OWASP is an EDITORIAL mapping, not canon. OWASP ASI
  # is a risk/loss-class taxonomy (unordered), NOT a kill-chain. Each ASI is
  # placed at the NEAREST ATT&CK stage purely for UI bucketing in
  # coverage_by_tactic(); it does NOT affect covered/uncovered, the paradox, or
  # crosswalks. The weakest calls carry an inline `rationale:` below. A proper
  # decoupling (e.g. a `tactic_source` discriminator) is deferred to ТЗ-09.
  - technique_id: ASI01
    framework: owasp
    name: Agent Goal Hijack
    tactic: initial-access
    parent_technique: null
    url: https://genai.owasp.org/
    source: owasp-seed
    description: "Adversary redirects the agent's goal/instructions (e.g. via injected content)."
  - technique_id: ASI02
    framework: owasp
    name: Tool Misuse and Exploitation
    tactic: execution
    parent_technique: null
    url: https://genai.owasp.org/
    source: owasp-seed
    description: "Abuse or exploitation of the agent's tools/plugins beyond intent."
  - technique_id: ASI03
    framework: owasp
    name: Identity and Privilege Abuse
    tactic: privilege-escalation
    parent_technique: null
    url: https://genai.owasp.org/
    source: owasp-seed
    description: "Abuse of the agent's identity, credentials, or excessive privilege."
  - technique_id: ASI04
    framework: owasp
    name: Agentic Supply Chain Vulnerabilities
    tactic: initial-access
    parent_technique: null
    url: https://genai.owasp.org/
    source: owasp-seed
    description: "Compromised skills/plugins/MCP servers/models in the agent supply chain."
  - technique_id: ASI05
    framework: owasp
    name: Unexpected Code Execution
    tactic: execution
    parent_technique: null
    url: https://genai.owasp.org/
    source: owasp-seed
    description: "Agent induced to execute unintended code/commands."
  - technique_id: ASI06
    framework: owasp
    name: Memory and Context Poisoning
    # rationale: weak fit. Poisoning agent memory is a preparation/corruption
    # phase, not ATT&CK persistence (maintaining a foothold). Mapped to
    # persistence as the nearest stage because the poison PERSISTS in
    # memory/context and influences later turns; arguable vs initial-access.
    tactic: persistence
    parent_technique: null
    url: https://genai.owasp.org/
    source: owasp-seed
    description: "Persistent poisoning of agent memory/context to influence later actions."
  - technique_id: ASI07
    framework: owasp
    name: Insecure Inter-Agent Communication
    # rationale: weak fit. The real tactic depends on what is exploited
    # (cred-access / execution / priv-esc). Mapped to lateral-movement as the
    # nearest stage for the agent→agent trust-crossing shape; not intrinsic.
    tactic: lateral-movement
    parent_technique: null
    url: https://genai.owasp.org/
    source: owasp-seed
    description: "Trust/abuse across agent-to-agent or agent-to-server channels."
  - technique_id: ASI08
    framework: owasp
    name: Cascading Failures
    tactic: impact
    parent_technique: null
    url: https://genai.owasp.org/
    source: owasp-seed
    description: "One failure/compromise cascades across dependent agents/systems."
  - technique_id: ASI09
    framework: owasp
    name: Human-Agent Trust Exploitation
    # rationale: weak fit. Social engineering VIA the agent; the executed tactic
    # is whatever the human is tricked into (often execution / priv-esc). Mapped
    # to initial-access treating the agent as the entry point; contestable.
    tactic: initial-access
    parent_technique: null
    url: https://genai.owasp.org/
    source: owasp-seed
    description: "Exploiting the human's trust in the agent (social engineering via the agent)."
  - technique_id: ASI10
    framework: owasp
    name: Rogue Agents
    tactic: defense-evasion
    parent_technique: null
    url: https://genai.owasp.org/
    source: owasp-seed
    description: "An agent acting outside policy/oversight, incl. a disabled/suppressed sensor."
