# Threat-technique taxonomy seed — THREE EQUAL frameworks (ТЗ-08).
#
# Version-controlled, code-reviewed vetted slice loaded idempotently at startup
# into the `technique` table. NOT a network autoload of the full corpora — that
# is Path-2 (future ТЗ). One table, `framework` discriminator (three EQUAL
# projections, not a nesting; cross-framework links live in
# technique_crosswalk_seed.yaml):
#   - attack : classic MITRE ATT&CK techniques our ThreatIndicator seed (ТЗ-05)
#              references + the nearest context for our correlation detectors.
#   - atlas  : MITRE ATLAS AI-specific AML.* techniques.
#   - owasp  : OWASP Top 10 for Agentic Applications (2026) ASI01..ASI10 — the
#              agentic layer where our behavioral detectors map.
#
# `in_scope: false` marks techniques an endpoint EDR for dev machines
# structurally CANNOT cover (model/training-internal). They load for a complete
# picture but are excluded from coverage gaps so the map shows honest holes.
#
# Fields: technique_id, framework, name, tactic, description, parent_technique,
#         in_scope, url, source.

