{% extends "base.html" %}
{% block title %}ccguard — вход{% endblock %}
{% block content %}
<style>
  .lg-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1000px 540px at 72% -12%, #1d0f2e 0, transparent 60%)}
  .lg-card{width:100%;max-width:380px;background:#16121f;border:1px solid #ffffff14;border-radius:22px;padding:34px}
  .lg-in{margin-top:7px;display:block;width:100%;border-radius:11px;padding:11px 13px;color:#f3f0f7;
    background:#0e0b14;border:1px solid #ffffff1f;outline:none;transition:border-color .15s, box-shadow .15s;font-size:14px}
  .lg-in:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.22)}
  .lg-lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8a8394}
  .lg-btn{width:100%;border-radius:11px;padding:12px;margin-top:22px;font-weight:700;color:#fff;border:0;cursor:pointer;
    background:linear-gradient(180deg,#c45cff,#7c3aed);transition:filter .15s}
  .lg-btn:hover{filter:brightness(1.08)}
</style>
<div class="lg-wrap">
  <form method="POST" action="/login" class="lg-card">
    <div class="flex items-center gap-3 mb-7">
      <span class="grid place-items-center w-11 h-11 rounded-xl" style="background:linear-gradient(180deg,#c45cff,#7c3aed)">
        <svg viewBox="0 0 24 24" fill="none" class="w-6 h-6 text-white" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 5v6c0 5 3.4 8.3 8 11 4.6-2.7 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/>
        </svg>
      </span>
      <div>
        <div class="cc-display text-2xl text-white leading-none">ccguard</div>
        <div class="cc-mono text-[9px] tracking-[.24em] text-slate-500 mt-1">EDR · AI AGENTS</div>
      </div>
    </div>
    <label class="block mb-4">
      <span class="lg-lab">Логин</span>
      <input type="text" name="username" required autofocus class="lg-in" />
    </label>
    <label class="block">
      <span class="lg-lab">Пароль</span>
      <input type="password" name="password" required class="lg-in" />
    </label>
    <button type="submit" class="lg-btn">Войти</button>
  </form>
</div>
{% endblock %}
