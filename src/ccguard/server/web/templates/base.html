<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ccguard{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
              display: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'sans-serif'],
            },
            colors: {
              ink: { 900: '#0b0810', 850: '#0e0b14', 800: '#16121f', 700: '#1b1626', 600: '#241d31' },
              signal: '#34d399',
              accent: { DEFAULT: '#a855f7', 2: '#c45cff', mag: '#e455c8' },
            },
            keyframes: {
              ccRise: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              ccPulse: { '0%,100%': { opacity: '1' }, '50%': { opacity: '.35' } },
            },
            animation: { ccRise: 'ccRise .5s cubic-bezier(.22,1,.36,1) both', ccPulse: 'ccPulse 2.4s ease-in-out infinite' },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg:#0b0810; --bg2:#0e0b14; --card:#16121f; --card2:#1b1626; --line:#ffffff14;
        --txt:#f3f0f7; --muted:#8a8394; --mut2:#5f5970;
        --pur:#a855f7; --pur2:#c45cff; --mag:#e455c8; --grad:linear-gradient(180deg,#c45cff,#7c3aed);
        --warn:#ff6a1a; --red:#ff5470; --green:#34d399; --blue:#3b9bf0; --orange:#f97316; --pink:#ec4899;
      }
      body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: var(--txt); }
      .font-mono, code, pre, .cc-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      h1, h2, h3, .cc-display { font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -0.02em; font-weight: 800; }
      .cc-num { font-variant-numeric: tabular-nums; letter-spacing:-.02em; font-weight:800; }

      /* Dark "Fortexa" work surface */
      .cc-surface {
        background-color: var(--bg);
        background-image:
          radial-gradient(1100px 560px at 78% -12%, rgba(124,58,237,.20), transparent 60%),
          radial-gradient(760px 480px at -6% 108%, rgba(228,85,200,.08), transparent 55%);
        background-attachment: fixed, fixed;
      }

      /* New dark card primitive (used by redesigned pages) */
      .cc-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; }
      .cc-card-2 { background: var(--card2); border: 1px solid var(--line); border-radius: 15px; }

      /* Legacy white cards from not-yet-restyled pages still read fine on dark */
      .cc-surface .bg-white { box-shadow: 0 18px 40px -22px rgba(0,0,0,.6); }

      /* Inputs */
      .cc-surface input:not([type=checkbox]):not([type=radio]), .cc-surface select, .cc-surface textarea {
        transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
      }
      .cc-surface input:focus, .cc-surface select:focus, .cc-surface textarea:focus {
        outline: none; border-color: var(--pur) !important; box-shadow: 0 0 0 3px rgba(168,85,247,.22);
      }

      /* Sidebar nav */
      .cc-nav-link {
        position: relative; display: flex; align-items: center; gap: .625rem;
        padding: .5rem .75rem; border-radius: .6rem; color: #9b94a8;
        font-size: .8125rem; font-weight: 500; transition: all .16s ease; border: 1px solid transparent;
      }
      .cc-nav-link svg { width: 16px; height: 16px; flex: none; opacity: .85; }
      .cc-nav-link:hover { color: #ece8f4; background: rgba(255,255,255,.04); }
      .cc-nav-link[aria-current="page"] {
        color: #fff; background: linear-gradient(90deg, rgba(168,85,247,.14), transparent);
      }
      .cc-nav-link[aria-current="page"] svg { opacity: 1; color: var(--pur2); }
      .cc-nav-link[aria-current="page"]::before {
        content: ""; position: absolute; left: -3px; top: 16%; bottom: 16%;
        width: 3px; border-radius: 3px; background: var(--pur2); box-shadow: 0 0 12px rgba(196,92,255,.8);
      }
      .cc-nav-group { font-family: "IBM Plex Mono", monospace; font-size: .5625rem; letter-spacing: .18em;
        text-transform: uppercase; color: var(--mut2); padding: .25rem .75rem; margin-top: .75rem; font-weight:700; }

      main > * { animation: ccRise .5s cubic-bezier(.22,1,.36,1) both; }

      .cc-surface ::-webkit-scrollbar { height: 10px; width: 10px; }
      .cc-surface ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
      .cc-surface ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); background-clip: padding-box; }

      .cc-eyebrow { font-family: "IBM Plex Mono", monospace; font-size: .625rem; font-weight: 600;
        letter-spacing: .16em; text-transform: uppercase; color: var(--pur2); }

      .cc-surface summary { list-style: none; }
      .cc-surface summary::-webkit-details-marker { display: none; }
      .cc-chevron { transition: transform .2s ease; }
      details[open] > summary .cc-chevron { transform: rotate(90deg); }

      /* Severity pills (dark) */
      .cc-sev { display:inline-flex; align-items:center; gap:.35rem; font-family:"IBM Plex Mono",monospace;
        font-size:.625rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
        border-radius:999px; padding:.2rem .55rem; border:1px solid; }
      .cc-sev-info  { color:#a9b2c0; background:#ffffff0d; border-color:#ffffff1f; }
      .cc-sev-warn  { color:#fbb86b; background:#f9731618; border-color:rgba(249,115,22,.35); }
      .cc-sev-block { color:#ff8aa0; background:#ff547018; border-color:rgba(255,84,112,.4); }
      /* control-type chips */
      .cc-ct { font-family:"IBM Plex Mono",monospace; font-size:.625rem; font-weight:700; letter-spacing:.06em;
        border-radius:6px; padding:.1rem .45rem; border:1px solid; }
      .cc-ct-prev { color:#fbb86b; background:#f9731614; border-color:rgba(249,115,22,.35); }
      .cc-ct-detect { color:#c9b6ff; background:#a855f714; border-color:rgba(168,85,247,.4); }
      .cc-ct-scope { color:#7ee9c0; background:#34d39914; border-color:rgba(52,211,153,.35); }
    </style>
</head>
<body class="bg-ink-900 text-slate-100 min-h-screen">
    {% if user %}
    <div class="flex min-h-screen">
        <aside class="w-60 shrink-0 bg-ink-850 text-slate-100 flex flex-col border-r border-white/5">
            <div class="px-5 pt-6 pb-5 border-b border-white/5">
                <div class="flex items-center gap-2.5">
                    <span class="grid place-items-center w-9 h-9 rounded-xl" style="background:var(--grad)">
                        <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5 text-white" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2 4 5v6c0 5 3.4 8.3 8 11 4.6-2.7 8-6 8-11V5l-8-3Z"/>
                            <path d="m9 12 2 2 4-4"/>
                        </svg>
                    </span>
                    <div>
                        <h1 class="cc-display text-lg leading-none text-white">ccguard</h1>
                        <p class="cc-mono text-[9px] tracking-[0.22em] text-slate-500 mt-1">EDR · AI AGENTS</p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 px-3 py-3 space-y-0.5 overflow-y-auto" aria-label="Навигация">
                <p class="cc-nav-group">Постура</p>
                <a href="/" class="cc-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                    Обзор
                </a>
                <a href="/coverage" class="cc-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg>
                    Карта покрытия
                </a>
                <p class="cc-nav-group">Детект</p>
                <a href="/findings" class="cc-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></svg>
                    Находки
                </a>
                <a href="/anomalies" class="cc-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>
                    Аномалии
                </a>
                <a href="/audit" class="cc-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 3h9l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M9 13h6M9 17h4"/></svg>
                    Аудит
                </a>
                <a href="/admin/skills-inventory" class="cc-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.27 6.96 8.73 5.05 8.73-5.05"/><path d="M12 22.08V12"/></svg>
                    Артефакты
                </a>
                <p class="cc-nav-group">Управление</p>
                <a href="/machines" class="cc-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                    Машины
                </a>
                <a href="/policy" class="cc-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.3 8 11 4.6-2.7 8-6 8-11V5l-8-3Z"/></svg>
                    Политика
                </a>
                <a href="/policy/history" class="cc-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v6h6"/><path d="M3.5 9a9 9 0 1 0 2.1-3.4L3 9"/><path d="M12 7v5l3 2"/></svg>
                    История
                </a>
                <a href="/settings" class="cc-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
                    Настройки
                </a>
            </nav>
            <div class="px-4 py-3 border-t border-white/5 flex items-center justify-between">
                <span class="inline-flex items-center gap-1.5 text-[11px] text-slate-400">
                    <span class="w-1.5 h-1.5 rounded-full bg-signal animate-ccPulse"></span>
                    <span class="cc-mono">сервер · online</span>
                </span>
                <form method="POST" action="/logout">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
                    <button class="text-xs text-slate-400 hover:text-white transition-colors">Выйти</button>
                </form>
            </div>
        </aside>
        <main class="cc-surface flex-1 p-8 min-w-0">{% block content %}{% endblock %}</main>
    </div>
    <script>
      (function () {
        var path = window.location.pathname;
        var links = document.querySelectorAll('.cc-nav-link');
        var best = null, bestLen = -1;
        links.forEach(function (a) {
          var href = a.getAttribute('href');
          var match = href === '/' ? path === '/' : path.indexOf(href) === 0;
          if (match && href.length > bestLen) { best = a; bestLen = href.length; }
        });
        if (best) best.setAttribute('aria-current', 'page');
      })();
      // Live counter for policy list-field textareas (one non-blank line = one item).
      (function () {
        function refresh(ta) {
          var label = document.querySelector('[data-list-counter-for="' + ta.id + '"]');
          if (!label) return;
          var n = ta.value.split('\n').filter(function (l) { return l.trim().length > 0; }).length;
          label.textContent = n + ' элементов';
        }
        document.querySelectorAll('textarea[data-list-counter]').forEach(function (ta) {
          ta.addEventListener('input', function () { refresh(ta); });
        });
      })();
      // Chip-pill UI on top of policy list-field textareas — progressive
      // enhancement, the textarea remains the source of truth for form POST.
      (function () {
        function escapeHtml(s) {
          return s.replace(/[&<>"']/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
          });
        }
        function getItems(ta) {
          return ta.value.split('\n').map(function (l) { return l.trim(); })
            .filter(function (l) { return l.length > 0; });
        }
        function setItems(ta, items) {
          ta.value = items.join('\n');
          ta.dispatchEvent(new Event('input', { bubbles: true }));
        }
        function render(root) {
          var ta = root.querySelector('[data-chip-textarea]');
          var container = root.querySelector('[data-chip-container]');
          if (!ta || !container) return;
          var items = getItems(ta);
          container.innerHTML = items.length === 0
            ? '<span class="cc-mono text-[10px] text-slate-400 px-1">пусто</span>'
            : items.map(function (item, idx) {
                return '<span class="inline-flex items-center gap-1 bg-white/5 ring-1 ring-white/10 rounded-md px-2 py-0.5 cc-mono text-xs text-slate-200">'
                  + escapeHtml(item)
                  + '<button type="button" data-chip-remove="' + idx
                  + '" class="text-slate-400 hover:text-red-400 ml-1" aria-label="удалить">×</button>'
                  + '</span>';
              }).join('');
          container.querySelectorAll('[data-chip-remove]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var idx = parseInt(btn.getAttribute('data-chip-remove'), 10);
              var arr = getItems(ta);
              arr.splice(idx, 1);
              setItems(ta, arr);
              render(root);
            });
          });
        }
        function activate(root) {
          var ta = root.querySelector('[data-chip-textarea]');
          var container = root.querySelector('[data-chip-container]');
          var inputRow = root.querySelector('.cc-chip-input-row');
          var input = root.querySelector('[data-chip-input]');
          var addBtn = root.querySelector('[data-chip-add]');
          if (!ta || !container || !input || !addBtn || !inputRow) return;
          ta.classList.add('hidden');
          container.classList.remove('hidden');
          container.classList.add('flex');
          inputRow.classList.remove('hidden');
          inputRow.classList.add('flex');
          function addCurrent() {
            var v = input.value.trim();
            if (!v) return;
            var arr = getItems(ta);
            if (arr.indexOf(v) === -1) arr.push(v);
            setItems(ta, arr);
            input.value = '';
            render(root);
          }
          addBtn.addEventListener('click', addCurrent);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); addCurrent(); }
          });
          render(root);
        }
        document.querySelectorAll('[data-chip-list]').forEach(activate);
      })();
    </script>
    {% else %}
    {% block content_anonymous %}{{ self.content() }}{% endblock %}
    {% endif %}
</body>
</html>
