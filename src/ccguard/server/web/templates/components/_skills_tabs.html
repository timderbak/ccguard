{# Skills/agents artifact axis: the TOFU baseline inventory and the LLM content
   scan — two views of the same skills/agents artifacts. Set ``active_tab`` to
   one of: inventory | scan before including. #}
<div class="mb-1 cc-eyebrow" style="color:var(--slate-500,#64748b)">Skills / sub-agents</div>
<nav class="flex gap-1 border-b border-white/10 mb-6 text-sm flex-wrap" aria-label="Skills / sub-agents">
  <a href="/admin/skills-inventory"
     class="px-4 py-2.5 -mb-px border-b-2 inline-flex items-center gap-2 transition-colors
            {% if active_tab == 'inventory' %}border-[#c45cff] text-white font-semibold
            {% else %}border-transparent text-slate-400 hover:text-slate-200 hover:border-white/20{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.27 6.96 8.73 5.05 8.73-5.05"/><path d="M12 22.08V12"/></svg>
    Артефакты флита <span class="text-[11px] text-slate-500">baseline</span>
  </a>
  <a href="/admin/skills"
     class="px-4 py-2.5 -mb-px border-b-2 inline-flex items-center gap-2 transition-colors
            {% if active_tab == 'scan' %}border-[#c45cff] text-white font-semibold
            {% else %}border-transparent text-slate-400 hover:text-slate-200 hover:border-white/20{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    LLM-скан <span class="text-[11px] text-slate-500">содержимое</span>
  </a>
</nav>
