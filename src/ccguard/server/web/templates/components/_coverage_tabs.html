{# Coverage axis: the technique grid and the detectors that cover it — two views
   of the same technique↔detector relation. Set ``active_tab`` to one of:
   coverage | correlations before including. #}
<div class="mb-1 cc-eyebrow" style="color:var(--slate-500,#64748b)">Покрытие</div>
<nav class="flex gap-1 border-b border-white/10 mb-6 text-sm flex-wrap" aria-label="Покрытие">
  <a href="/coverage"
     class="px-4 py-2.5 -mb-px border-b-2 inline-flex items-center gap-2 transition-colors
            {% if active_tab == 'coverage' %}border-[#c45cff] text-white font-semibold
            {% else %}border-transparent text-slate-400 hover:text-slate-200 hover:border-white/20{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
    Карта покрытия <span class="text-[11px] text-slate-500">техники</span>
  </a>
  <a href="/correlations"
     class="px-4 py-2.5 -mb-px border-b-2 inline-flex items-center gap-2 transition-colors
            {% if active_tab == 'correlations' %}border-[#c45cff] text-white font-semibold
            {% else %}border-transparent text-slate-400 hover:text-slate-200 hover:border-white/20{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11L15.8 7M8.2 13l7.6 4"/></svg>
    Корреляции <span class="text-[11px] text-slate-500">детекторы</span>
  </a>
</nav>
