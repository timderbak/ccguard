<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ccguard — вход</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
              display: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'sans-serif'],
            },
            colors: {
              ink: { 900: '#0b0810', 850: '#0e0b14', 800: '#16121f', 700: '#1b1626', 600: '#241d31' },
              signal: '#34d399',
              accent: { DEFAULT: '#a855f7', 2: '#c45cff', mag: '#e455c8' },
            },
            keyframes: {
              ccRise: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              ccPulse: { '0%,100%': { opacity: '1' }, '50%': { opacity: '.35' } },
            },
            animation: { ccRise: 'ccRise .5s cubic-bezier(.22,1,.36,1) both', ccPulse: 'ccPulse 2.4s ease-in-out infinite' },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg:#0b0810; --bg2:#0e0b14; --card:#16121f; --card2:#1b1626; --line:#ffffff14;
        --txt:#f3f0f7; --muted:#8a8394; --mut2:#5f5970;
        --pur:#a855f7; --pur2:#c45cff; --mag:#e455c8; --grad:linear-gradient(180deg,#c45cff,#7c3aed);
        --warn:#ff6a1a; --red:#ff5470; --green:#34d399; --blue:#3b9bf0; --orange:#f97316; --pink:#ec4899;
      }
      body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: var(--txt); }
      .font-mono, code, pre, .cc-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      h1, h2, h3, .cc-display { font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -0.02em; font-weight: 800; }
      .cc-num { font-variant-numeric: tabular-nums; letter-spacing:-.02em; font-weight:800; }

      /* Dark "Fortexa" work surface */
      .cc-surface {
        background-color: var(--bg);
        background-image:
          radial-gradient(1100px 560px at 78% -12%, rgba(124,58,237,.20), transparent 60%),
          radial-gradient(760px 480px at -6% 108%, rgba(228,85,200,.08), transparent 55%);
        background-attachment: fixed, fixed;
      }

      /* New dark card primitive (used by redesigned pages) */
      .cc-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; }
      .cc-card-2 { background: var(--card2); border: 1px solid var(--line); border-radius: 15px; }

      /* Legacy white cards from not-yet-restyled pages still read fine on dark */
      .cc-surface .bg-white { box-shadow: 0 18px 40px -22px rgba(0,0,0,.6); }

      /* Inputs */
      .cc-surface input:not([type=checkbox]):not([type=radio]), .cc-surface select, .cc-surface textarea {
        transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
      }
      .cc-surface input:focus, .cc-surface select:focus, .cc-surface textarea:focus {
        outline: none; border-color: var(--pur) !important; box-shadow: 0 0 0 3px rgba(168,85,247,.22);
      }

      /* Sidebar nav */
      .cc-nav-link {
        position: relative; display: flex; align-items: center; gap: .625rem;
        padding: .5rem .75rem; border-radius: .6rem; color: #9b94a8;
        font-size: .8125rem; font-weight: 500; transition: all .16s ease; border: 1px solid transparent;
      }
      .cc-nav-link svg { width: 16px; height: 16px; flex: none; opacity: .85; }
      .cc-nav-link:hover { color: #ece8f4; background: rgba(255,255,255,.04); }
      .cc-nav-link[aria-current="page"] {
        color: #fff; background: linear-gradient(90deg, rgba(168,85,247,.14), transparent);
      }
      .cc-nav-link[aria-current="page"] svg { opacity: 1; color: var(--pur2); }
      .cc-nav-link[aria-current="page"]::before {
        content: ""; position: absolute; left: -3px; top: 16%; bottom: 16%;
        width: 3px; border-radius: 3px; background: var(--pur2); box-shadow: 0 0 12px rgba(196,92,255,.8);
      }
      .cc-nav-group { font-family: "IBM Plex Mono", monospace; font-size: .5625rem; letter-spacing: .18em;
        text-transform: uppercase; color: var(--mut2); padding: .25rem .75rem; margin-top: .75rem; font-weight:700; }

      main > * { animation: ccRise .5s cubic-bezier(.22,1,.36,1) both; }

      .cc-surface ::-webkit-scrollbar { height: 10px; width: 10px; }
      .cc-surface ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
      .cc-surface ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); background-clip: padding-box; }

      .cc-eyebrow { font-family: "IBM Plex Mono", monospace; font-size: .625rem; font-weight: 600;
        letter-spacing: .16em; text-transform: uppercase; color: var(--pur2); }

      .cc-surface summary { list-style: none; }
      .cc-surface summary::-webkit-details-marker { display: none; }
      .cc-chevron { transition: transform .2s ease; }
      details[open] > summary .cc-chevron { transform: rotate(90deg); }

      /* Severity pills (dark) */
      .cc-sev { display:inline-flex; align-items:center; gap:.35rem; font-family:"IBM Plex Mono",monospace;
        font-size:.625rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
        border-radius:999px; padding:.2rem .55rem; border:1px solid; }
      .cc-sev-info  { color:#a9b2c0; background:#ffffff0d; border-color:#ffffff1f; }
      .cc-sev-warn  { color:#fbb86b; background:#f9731618; border-color:rgba(249,115,22,.35); }
      .cc-sev-block { color:#ff8aa0; background:#ff547018; border-color:rgba(255,84,112,.4); }
      /* control-type chips */
      .cc-ct { font-family:"IBM Plex Mono",monospace; font-size:.625rem; font-weight:700; letter-spacing:.06em;
        border-radius:6px; padding:.1rem .45rem; border:1px solid; }
      .cc-ct-prev { color:#fbb86b; background:#f9731614; border-color:rgba(249,115,22,.35); }
      .cc-ct-detect { color:#c9b6ff; background:#a855f714; border-color:rgba(168,85,247,.4); }
      .cc-ct-scope { color:#7ee9c0; background:#34d39914; border-color:rgba(52,211,153,.35); }
      /* framework + technique chips (shared by detect pages) */
      .fwchip { font-family:"IBM Plex Mono",monospace; font-size:9px; font-weight:700; letter-spacing:.04em;
        border-radius:5px; padding:1px 5px; border:1px solid; }
      .fw-atlas  { color:#c9b6ff; background:#a855f714; border-color:#a855f73d; }
      .fw-attack { color:#9ad0ff; background:#3b9bf014; border-color:#3b9bf03d; }
      .fw-owasp  { color:#fbb6e0; background:#ec489914; border-color:#ec48993d; }
      .techchip { display:inline-flex; align-items:center; gap:6px; background:var(--card2);
        border:1px solid var(--line); border-radius:9px; padding:5px 9px; font-size:11px; color:#d8d2e4; margin:3px 3px 0 0; }

      /* --- Phase 3 dark shim: remap legacy Tailwind-light utilities to dark, so
         not-yet-restyled pages (machines, findings, audit, policy, settings,
         anomalies, partials) become cohesively dark with NO per-template edits
         and NO markup change (content tests untouched). Scoped to .cc-surface. */
      .cc-surface .bg-white { background: var(--card) !important; border: 1px solid var(--line); }
      .cc-surface .bg-slate-50, .cc-surface .bg-slate-100, .cc-surface .bg-gray-50,
      .cc-surface .bg-gray-100, .cc-surface .bg-slate-200 { background: var(--card2) !important; }
      .cc-surface .text-slate-900, .cc-surface .text-gray-900, .cc-surface .text-black { color: #f3f0f7 !important; }
      .cc-surface .text-slate-800, .cc-surface .text-slate-700, .cc-surface .text-gray-800,
      .cc-surface .text-gray-700 { color: #cbc6d6 !important; }
      .cc-surface .text-slate-600, .cc-surface .text-slate-500, .cc-surface .text-gray-600,
      .cc-surface .text-gray-500, .cc-surface .text-slate-400, .cc-surface .text-gray-400 { color: #8a8394 !important; }
      .cc-surface .border-slate-200, .cc-surface .border-slate-100, .cc-surface .border-gray-200,
      .cc-surface .border-gray-100, .cc-surface .border-slate-300 { border-color: var(--line) !important; }
      .cc-surface .divide-slate-200 > :not([hidden]) ~ :not([hidden]),
      .cc-surface .divide-gray-200 > :not([hidden]) ~ :not([hidden]) { border-color: var(--line) !important; }
      .cc-surface .ring-slate-200, .cc-surface .ring-gray-200, .cc-surface .ring-slate-100 { --tw-ring-color: var(--line) !important; }
      .cc-surface .hover\:bg-slate-50:hover, .cc-surface .hover\:bg-gray-50:hover,
      .cc-surface .hover\:bg-slate-100:hover { background: rgba(255,255,255,.04) !important; }
      /* soft colored status backgrounds → faint dark tints (keep their accent text) */
      .cc-surface .bg-emerald-50, .cc-surface .bg-green-50 { background: rgba(52,211,153,.10) !important; }
      .cc-surface .bg-red-50, .cc-surface .bg-rose-50 { background: rgba(255,84,112,.10) !important; }
      .cc-surface .bg-amber-50, .cc-surface .bg-yellow-50 { background: rgba(249,115,22,.10) !important; }
      .cc-surface .bg-blue-50, .cc-surface .bg-indigo-50, .cc-surface .bg-violet-50, .cc-surface .bg-purple-50 { background: rgba(168,85,247,.10) !important; }
    </style>
</head>
<body class="bg-ink-900 text-slate-100 min-h-screen">
    
    
<div class="min-h-screen flex items-center justify-center">
    <form method="POST" action="/login" class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-semibold mb-6">ccguard</h1>
        <label class="block mb-4">
            <span class="text-sm">Логин</span>
            <input type="text" name="username" required
                   class="mt-1 block w-full rounded border border-slate-300" />
        </label>
        <label class="block mb-4">
            <span class="text-sm">Пароль</span>
            <input type="password" name="password" required
                   class="mt-1 block w-full rounded border border-slate-300" />
        </label>
        <button type="submit"
                class="w-full bg-slate-900 text-white rounded py-2">
            Войти
        </button>
    </form>
</div>

    
</body>
</html>
